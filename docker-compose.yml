version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: persistent-agent-runtime-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-persistent_agent_runtime}
    ports:
      - "${DB_PORT:-55432}:5432"
    command: postgres -c log_statement=all
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-persistent_agent_runtime}"]
      interval: 2s
      timeout: 5s
      retries: 15

  localstack:
    image: localstack/localstack:3
    container_name: persistent-agent-runtime-localstack
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "4566:4566"
    volumes:
      - "./scripts/init-localstack.sh:/etc/localstack/init/ready.d/init-localstack.sh"
      - localstackdata:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "awslocal s3 ls"]
      interval: 5s
      timeout: 10s
      retries: 10

# Explicit, project-independent volume names. The services already use fixed
# container_names; pin the volumes the same way so the dev stack's data identity
# does not depend on the Compose project name. Without this, Compose prefixes
# unnamed volumes with the project (e.g. <dir-basename>_pgdata from a worktree),
# so a project change would silently start PostgreSQL on a fresh empty volume.
# These names match the canonical `persistent-agent-runtime_*` volumes that
# existing default installs already have, so this is a no-op for them.
volumes:
  pgdata:
    name: persistent-agent-runtime_pgdata
  localstackdata:
    name: persistent-agent-runtime_localstackdata
